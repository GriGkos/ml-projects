name: README cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove educational label from Home Credit README
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('projects/04_home_credit_scoring/README.md')
          text = path.read_text(encoding='utf-8')
          old = 'Учебный ML-проект по данным соревнования'
          new = 'ML-проект по данным соревнования'
          if old not in text:
              raise SystemExit('Expected text not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/04_home_credit_scoring/README.md
          git commit -m "Polish Home Credit project description"
          git push
